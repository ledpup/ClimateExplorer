name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    # Skip draft PRs
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for ClimateExplorer, a .NET / Blazor
            application that charts climate data. Focus on:
            - correctness bugs and edge cases (nulls, empty data sets, date and
              unit handling, off-by-one errors in aggregation)
            - performance problems when loading or processing large data files
            - Blazor component lifecycle, state and disposal issues
            - API and data-contract changes that could break the web client
            - missing or inadequate tests for changed behaviour
            - security concerns

            Be concise and specific. Skip style nitpicks that the compiler or
            formatter would catch. Post inline comments on the relevant lines
            and finish with a short summary comment.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
